<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CashDex - Abra sua conta</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <main class="fullscreen-container">
        <section class="form-card">
            <header class="form-header">
                <i class="fas fa-university logo-icon"></i>
                <h1>CashDex</h1>
                <p>Seja bem-vindo! Vamos criar sua conta digital. 👋</p>
            </header>

            <form id="cadastroForm">
                <div class="input-group">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" required placeholder="Digite seu nome">
                </div>

                <div class="input-row">
                    <div class="input-group">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" required placeholder="000.000.000-00">
                    </div>
                    <div class="input-group">
                        <label for="nascimento">Nascimento</label>
                        <input type="date" id="nascimento" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" required placeholder="exemplo@email.com">
                </div>

                <div class="input-group">
                    <label for="endereco">Endereço Residencial</label>
                    <input type="text" id="endereco" required placeholder="Rua, número, bairro">
                </div>

                <div class="input-group">
                    <label for="senha">Senha de Acesso</label>
                    <input type="password" id="senha" required placeholder="Crie uma senha forte">
                </div>

                <button type="submit" class="btn-submit">Criar minha conta</button>
            </form>

            <footer class="form-footer">
                <i class="fas fa-lock"></i>
                <span>Conexão segura e dados criptografados</span>
            </footer>
        </section>
    </main>
<script src="cadastro.js"></script>
</body>
</html>
