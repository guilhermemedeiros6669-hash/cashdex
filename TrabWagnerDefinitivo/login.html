<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login - CashDex</title>
    <link rel="stylesheet" href="style.css"> </head>
<body>
    <div class="container">
        <h2>Acessar CashDex 🏦</h2>
        <form id="loginForm">
            <label for="cpfLogin">CPF:</label>
            <input type="text" id="cpfLogin" placeholder="000.000.000-00" required>

            <label for="senhaLogin">Senha:</label>
            <input type="password" id="senhaLogin" placeholder="Sua senha" required>

            <button type="submit">Entrar</button>
        </form>
        <p>Não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
    </div>
    <script src="login.js"></script>
</body>
</html>
